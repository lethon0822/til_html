<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <body>
    <div class="join_form">
      <h2>회원가입</h2>
      <!-- action: 정보를 보낼 주소 -->
      <!-- method: get방식은 웹브라우저에 노출됨(기본값, 생략하면 get으로) -->
      <form action="member_join.jsp" methon="get">
        <!-- name: 뒤에 적힌 것은 변수명, 입력된 값을 변수에 대입 -->
        <!-- 주소?변수&변수 / &으로 변수를 구분함 -->

        <fieldset>
          <!-- 입력 항목을 구분하여 묶어줌 -->
          <legend>기본정보</legend>

          <label for="userid">아이디</label>
          <!-- required: 입력 필수 항목 -->
          <input
            type="text"
            id="userid"
            name="userid"
            minlength="8"
            maxlength="16"
            required
          />

          <button>아이디 중복확인</button>
          <br />

          <label for="pass">비밀번호</label>
          <input
            id="pass"
            name="pass"
            type="password"
            minlength="8"
            maxlength="16"
            required
          />
          <br />

          <label for="confirmpass">비밀번호 확인</label>
          <input
            id="confirmpass"
            type="password"
            minlength="8"
            maxlength="16"
            required
          />
          <br />

          <label>이름</label>
          <input name="username" type="text" required / >
          <br />

          <label>이메일</label>
          <input name="useremail" type="email" required / >
          <br />

          <label>성별</label>
          <!-- checked: 디폴트 설정 -->
          <input name="usergender" type="radio" value="1" checked />남성
          <input name="usergender" type="radio" value="2" />여성
          <br />

          <label>생년월일</label>
          <input type="date" name="birthday" />
          <br />

          <label>이용약관</label>
          <!-- textarea: 공백이 포함됨(엔터키 안 치길 권장) -->
          <!-- readonly: 읽기만 가능 -->
          <textarea readonly></textarea>
          <br />

          <label for="agree">이용약관동의</label>
          <input type="checkbox" name="agree" />
          <br />

          <!-- 파일 용량을 파악/제어하는 건 JS에서 -->
          <label for="file">파일</label>
          <input type="file" name="file" />
        </fieldset>

        <fieldset>
          <legend>부가정보</legend>
          <label>지역</label>
          <select name="city">
            <option value="dg">대구</opsion>
            <option value="se">서울</opsion>
          </select>
        </fieldset>

        <!-- 버튼 -->
        <fieldset>
            <input type="reset" value="재작성"/>
            <input type="submit" value="회원가입"/>
        </fieldset>
      </form>
    </div>
  </body>
</html>
